name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight dependencies
        # The fast test suite (config + data + splits) needs only these. The model-dependent
        # tests skip automatically when torch / transformer_lens are absent, so CI stays quick
        # and does not download a model.
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyyaml pytest

      - name: Verify raw suites are reproducible
        run: |
          python data/build_suites.py
          git diff --exit-code -- data/prompts data/edit_targets.json

      - name: Verify the processed dataset is up to date
        run: |
          python src/data_loader.py --check
          git diff --exit-code -- data/processed

      - name: Run fast test suite
        run: pytest -q
