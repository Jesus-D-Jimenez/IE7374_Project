[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "black-box-lm"
version = "0.1.0"
description = "Mechanistic interpretability and ROME-style factual editing of Pythia language models."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jesus D. Jimenez Ballestas" }]
dependencies = [
    "torch>=2.1",
    "transformers>=4.40,<5",      # see requirements.txt for why 5.x is excluded
    "transformer_lens>=2.0,<3",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyter>=1.0", "ipykernel>=6.0"]

[tool.setuptools]
packages = ["models", "data", "utils", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
